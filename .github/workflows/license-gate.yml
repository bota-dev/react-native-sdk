name: License Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  license-gate:
    name: License Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Strict install when the lockfile is healthy; fall back to npm install
        # so a lockfile missing platform-optional deps doesn't block the gate.
        run: npm ci || npm install

      - name: Check dependency licenses
        run: npm run license-check
