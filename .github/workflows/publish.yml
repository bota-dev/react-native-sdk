name: Prepare legacy release candidate

on:
  push:
    tags:
      - 'v0.0.*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NPM_CLI_VERSION: '12.0.2'

jobs:
  candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable legacy tag identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v0\.0\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          SOURCE_REVISION="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          {
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "SOURCE_REVISION=$SOURCE_REVISION"
          } >> "$GITHUB_ENV"

      - name: Run release gates
        run: |
          npm run typecheck
          npm run lint
          npm test -- --runInBand
          npm run test:release
          npm run build
          npm run license-check

      - name: Build and verify deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/candidate-first target/candidate-second target/legacy-release
          FIRST_NAME="$(npx --yes "npm@$NPM_CLI_VERSION" pack --ignore-scripts --pack-destination target/candidate-first --silent)"
          SECOND_NAME="$(npx --yes "npm@$NPM_CLI_VERSION" pack --ignore-scripts --pack-destination target/candidate-second --silent)"
          test "$FIRST_NAME" = "$SECOND_NAME"
          FIRST_TARBALL="target/candidate-first/$FIRST_NAME"
          SECOND_TARBALL="target/candidate-second/$SECOND_NAME"
          cmp "$FIRST_TARBALL" "$SECOND_TARBALL"
          cp "$FIRST_TARBALL" "target/legacy-release/$FIRST_NAME"
          CANDIDATE_TARBALL="target/legacy-release/$FIRST_NAME"
          npm run release:candidate -- create \
            --tarball "$CANDIDATE_TARBALL" \
            --package-json package.json \
            --source-revision "$SOURCE_REVISION" \
            --tag "$GITHUB_REF_NAME" \
            --output target/legacy-release/release-candidate.json
          npm run release:candidate -- verify \
            --tarball "$CANDIDATE_TARBALL" \
            --inventory target/legacy-release/release-candidate.json

      - name: Preserve candidate for maintainer publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-react-native-${{ github.ref_name }}-${{ env.SOURCE_REVISION }}
          path: target/legacy-release/
          if-no-files-found: error
          retention-days: 30
